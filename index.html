addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;const t={v:'sel',g:'mv',m:'mv',s:'sc',r:'ro',b:'pa'}[e.key.toLowerCase()];if(t)setTool(t);else if(e.key=='Escape')setTool('sel')});
$('#ss').onchange=e=>G.st=+e.target.value;$('#sr').onchange=e=>G.rs=+e.target.value;
$('#xr').onclick=e=>{G.xr=!G.xr;e.target.classList.toggle('on',G.xr);parts.forEach(build);draw()};$('#xe').oninput=e=>{G.xp=+e.target.value;draw()};$('#pb').onclick=()=>$('#R').classList.toggle('open');
const wsrc=id=>{const i=IM[id].image;return i.toDataURL?i.toDataURL():i.src},addWp=id=>$('#wl').insertAdjacentHTML('beforeend',`<img data-id="${id}" src="${wsrc(id)}">`);
['#2c5bff,#b44dff','#ff7a18,#af002d','#00c6ff,#0072ff','#11998e,#38ef7d','#232526,#6b7280'].forEach(s=>{const[a,b]=s.split(','),id='w'+uid++;IM[id]=CT(cvx(512,1024,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,w,h)}));addWp(id)});
$('#wl').onclick=e=>{const id=e.target.dataset.id;if(!id)return;lastWp=id;const p=PT(sel),L=p&&p.t=='scr'?[p]:parts.filter(q=>q.t=='scr');L.forEach(q=>{q.p.k='img:'+id;build(q)});if(L.length)commit();else $('#hint').textContent='Add a Screen part first (Add tab → Tech → Screen)'};
$('#wu').onclick=()=>upload(id=>{addWp(id);lastWp=id});$('#wb').onclick=()=>{if(lastWp)vp.style.background=`url(${wsrc(lastWp)}) center/cover`};
$('#pl').onclick=()=>upload(id=>setPend({n:'Decal',al:1,f:()=>[P('Decal','decal',{w:24,img:id},0,0,.06,'plain','#ffffff')]}));
$('#sc2').insertAdjacentHTML('beforeend','<div class="g2" style="grid-template-columns:1fr"><button class="bt" id="gdt">Show / hide build grid</button></div>');$('#gdt').onclick=()=>{GRID.visible=!GRID.visible;draw()};
$('#ts').add(new Option('Blank — start building',-1),0);$('#ts').onchange=e=>+e.target.value<0?blank():load(+e.target.value);
tab(0);blank();
