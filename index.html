body{display:flex;flex-direction:column}
.sb{width:262px;flex:none;background:var(--p);overflow-y:auto}
.h{padding:12px 12px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.bt{background:var(--p2);border:1px solid var(--b);border-radius:7px;padding:5px 9px;color:var(--t);cursor:pointer;font:inherit;white-space:nowrap}
.bt:hover{border-color:var(--ac)}.bt.on,.bt.pr{background:var(--ac);border-color:var(--ac);color:#06101f;font-weight:600}

.rw{display:flex;align-items:center;gap:8px;padding:3px 12px}.rw>span{width:78px;flex:none;color:var(--m)}.rw>b{width:38px;text-align:right;font-weight:500}

.ly{display:flex;align-items:center;gap:7px;padding:4px 10px;border-bottom:1px solid #1c1f25;cursor:pointer}.ly.on{background:#24324a}.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly i{font-style:normal;opacity:.8}
#vp{position:relative;background:conic-gradient(#23262d 25%,#1a1c21 0 50%,#23262d 0 75%,#1a1c21 0) 0 0/28px 28px}
#gl{width:100%;height:100%;display:block;touch-action:none}
#vb{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(22,24,29,.88);border:1px solid var(--b);border-radius:10px;flex-wrap:wrap;justify-content:center;max-width:94%}
#hint{position:absolute;bottom:8px;left:12px;color:var(--m);pointer-events:none}
#tb{display:flex;gap:6px;padding:10px 12px 4px}
</style></head>
<body>
<header class="flex items-center gap-2 px-3 py-2 flex-wrap" style="background:var(--p);border-bottom:1px solid var(--b)">
<b class="tracking-wide">Concept<span style="color:var(--ac)">Forge</span> 3D</b>
<select id="ts"></select><button class="bt" id="un" title="Undo (Ctrl+Z)">↶</button><button class="bt" id="re" title="Redo (Ctrl+Y)">↷</button>
<span class="flex-1"></span>
<label class="flex items-center gap-1"><input type="checkbox" id="sn" checked>Snap 0.5mm</label>
<button class="bt" id="pl">Place logo / decal…</button><button class="bt pr" id="ex">Export PNG</button>
</header>
<div class="flex flex-1 min-h-0">
<aside class="sb" id="L" style="border-right:1px solid var(--b)">
<div class="h">Parts</div><div id="ol"></div>
<div class="h">Add part</div><div class="g2" id="ad"></div>
<div class="h">Modules</div><div class="g2" id="md"></div>
</aside>
<main id="vp" class="flex-1"><canvas id="gl"></canvas><div id="vb"></div><div id="hint"></div></main>
<aside class="sb" id="R" style="border-left:1px solid var(--b)">
<div id="tb"></div>
<div id="rp"><div id="pt"></div><div id="sc2" style="display:none"></div>
<div id="xp" style="display:none">
<div class="h">Render</div>
<div class="rw"><span>Resolution</span><select id="xs"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option></select></div>
<div class="rw"><span>Ground shadow</span><input type="checkbox" id="xg" checked></div>
<div class="g2" style="grid-template-columns:1fr"><button class="bt pr" id="e1">PNG — current view (alpha)</button><button class="bt" id="e2">PNG — 4-angle sheet (alpha)</button></div>
<div class="p-3" style="color:var(--m)">Transparent background. Sheet = front / 3-4 / side / back (or top-down set for flat devices), capped at 2×.</div>
</div></div>
</aside></div>
<input type="file" id="fi" accept="image/*" hidden>
