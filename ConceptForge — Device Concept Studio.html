<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ConceptForge — Device Concept Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
:root{--bg:#0f1013;--p:#17191e;--p2:#1f2229;--b:#2a2e37;--t:#cfd4de;--m:#7b8291;--ac:#6aa5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:12px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.sb{width:252px;flex:none;background:var(--p);overflow-y:auto;transition:margin .2s}
.sb.c{margin-left:-252px}.sb.rt.c{margin-left:0;margin-right:-252px}
.h{padding:12px 12px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.bt{background:var(--p2);border:1px solid var(--b);border-radius:7px;padding:5px 9px;color:var(--t);cursor:pointer;font:inherit;white-space:nowrap}
.bt:hover{border-color:var(--ac)}.bt.on,.bt.pr{background:var(--ac);border-color:var(--ac);color:#06101f;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 12px}
.rw{display:flex;align-items:center;gap:8px;padding:3px 12px}.rw>span{width:76px;color:var(--m);flex:none}
.rw input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}.rw input[type=color]{width:34px;height:24px;border:0;background:none;padding:0}.rw select{flex:1;min-width:0}
select{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:4px}
.ly{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid #1d2026;cursor:pointer}.ly.on{background:#24324a}
.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly i{font-style:normal;cursor:pointer;opacity:.85}
#cw{margin:auto;box-shadow:0 0 0 1px var(--b)}
.chk{background:conic-gradient(#2a2d34 25%,#1f2228 0 50%,#2a2d34 0 75%,#1f2228 0) 0 0/24px 24px}.dk{background:#0b0c0f}.lt{background:#e9ecf1}
#pv{position:fixed;inset:0;background:radial-gradient(#252a35,#07080a);display:none;align-items:center;justify-content:center;perspective:1200px;z-index:50;cursor:zoom-out}
#pi{max-width:80vw;max-height:80vh;transition:transform .1s;filter:drop-shadow(0 40px 40px rgba(0,0,0,.6))}
</style></head>
<body>
<header class="flex items-center gap-2 px-3 flex-none flex-wrap" style="background:var(--p);border-bottom:1px solid var(--b);min-height:46px">
<button class="bt" id="tl" title="Toggle left panel">☰</button>
<b class="tracking-wide mr-1">Concept<span style="color:var(--ac)">Forge</span></b>
<select id="ts"></select><span class="flex-1"></span>
<button class="bt" id="zo">−</button><span id="zl" class="w-10 text-center">100%</span><button class="bt" id="zi">+</button><button class="bt" id="zf">Fit</button>
<button class="bt" id="bg">Backdrop</button>
<label class="flex items-center gap-1"><input type="checkbox" id="sn" checked>Snap</label>
<button class="bt" id="p3">3D Preview</button>
<select id="xs"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
<label class="flex items-center gap-1"><input type="checkbox" id="tm" checked>Trim</label>
<button class="bt pr" id="ex">Export PNG (alpha)</button>
<button class="bt" id="tr" title="Toggle right panel">⚙</button>
</header>
<div class="flex flex-1 min-h-0">
<aside class="sb" id="L" style="border-right:1px solid var(--b)">
<div class="h">Templates</div><div class="g2" id="tg"></div>
<div class="h">Create</div>
<div class="g2"><button class="bt" id="aR">▭ Rect</button><button class="bt" id="aC">◯ Circle</button><button class="bt" id="aP">⬭ Pill</button><button class="bt" id="aT">T Text</button><button class="bt" id="aD">✎ Draw</button><button class="bt" id="aI">⇪ Image</button></div>
<input type="file" id="fi" accept="image/*" hidden>
<div class="h">Layers</div>
<div class="g2" style="grid-template-columns:repeat(4,1fr)"><button class="bt" id="gG" title="Group (Ctrl+G)">Grp</button><button class="bt" id="gU" title="Ungroup">Ungr</button><button class="bt" id="gD" title="Duplicate (Ctrl+D)">Dup</button><button class="bt" id="gX" title="Delete">Del</button></div>
<div id="ly" class="mt-2"></div>
</aside>
<main id="vp" class="flex-1 overflow-auto flex" style="background:#0b0c0f"><div id="cw" class="chk"><canvas id="c"></canvas></div></main>
<aside class="sb rt" id="Rr" style="border-left:1px solid var(--b)">
<div class="h">Lighting</div>
<div class="rw"><span>Light angle</span><input type="range" id="L1" min="0" max="360"><b id="Lv" class="w-9 text-right"></b></div>
<div class="rw"><span>Shadow depth</span><input type="range" id="sh" min="0" max="80"></div>
<div class="rw"><span>Specular</span><input type="range" id="sp" min="0" max="100"></div>
<div class="h">Material</div><div class="g2" id="mg"></div>
<div class="rw"><span>Chassis</span><input type="color" id="cc"></div>
<div class="rw"><span>Keys / parts</span><input type="color" id="ac"></div>
<div class="h">Screen</div>
<div class="rw"><span>Colors</span><input type="color" id="sa"><input type="color" id="sb2"></div>
<div class="rw"><span>Emissive glow</span><input type="range" id="gl" min="0" max="100"></div>
<div class="rw"><span>Glass gloss</span><input type="range" id="gs" min="0" max="100"></div>
<div class="h">Selected layer</div>
<div class="rw"><span>Color</span><input type="color" id="pc" value="#8e9aa8"></div>
<div class="rw"><span>Material</span><select id="pm"></select></div>
<div class="rw"><span>Opacity</span><input type="range" id="po" min="5" max="100" value="100"></div>
<div class="rw"><span>Blend</span><select id="pb"><option>source-over</option><option>multiply</option><option>screen</option><option>overlay</option><option>soft-light</option><option>lighten</option></select></div>
<div class="rw"><span>Corner radius</span><input type="range" id="pr" min="0" max="120" value="0"></div>
<div class="g2" style="grid-template-columns:1fr"><button class="bt" id="mp" title="Fit and clip the selected layer onto the device screen">Map selection onto screen</button></div>
<div class="p-3" style="color:var(--m)">Ctrl+wheel zoom · Del delete · Ctrl+D duplicate · Ctrl+G group</div>
</aside></div>
<div id="pv"><img id="pi" alt="3D preview"></div>

function layers(){if(busy)return;const a=cv.getActiveObjects(),el=$('#ly');el.innerHTML='';
cv.getObjects().slice().reverse().forEach(o=>{const d=document.createElement('div');d.className='ly'+(a.includes(o)?' on':'');
d.innerHTML=`<i title="Hide/show">${o.visible?'◉':'○'}</i><i title="Lock/unlock">${o.lk?'🔒':'🔓'}</i><span>${o.nm||o.type}</span><i title="Bring forward">▲</i><i title="Send backward">▼</i>`;
const[v,l,,u,w]=d.children,st=(f)=>e=>{e.stopPropagation();f();layers();cv.requestRenderAll()};
v.onclick=st(()=>{o.visible=!o.visible;cv.discardActiveObject()});
l.onclick=st(()=>{o.lk=!o.lk;o.set({selectable:!o.lk,evented:!o.lk&&o.role!='gloss'});cv.discardActiveObject()});
u.onclick=st(()=>o.bringForward());w.onclick=st(()=>o.sendBackwards());
d.onclick=()=>{if(!o.lk&&o.visible){cv.setActiveObject(o);cv.requestRenderAll()}};el.append(d)})}
function selSync(){const o=cv.getActiveObject();if(!o)return;let b=null;each(o,x=>{if(!b&&x.role&&/^#/.test(x.base||''))b=x.base});if(b)$('#pc').value=b;$('#po').value=(o.opacity||1)*100;$('#pb').value=o.globalCompositeOperation||'source-over';$('#pm').value=o.mat||''}
const ev=()=>{if(!busy){layers();selSync()}};
cv.on({'object:added':ev,'object:removed':ev,'object:modified':ev,'selection:created':ev,'selection:updated':ev,'selection:cleared':ev});
cv.on('object:moving',e=>{if(!$('#sn').checked)return;const o=e.target,t=9/Z,b=o.getBoundingRect(true,true),mx=[b.left,b.left+b.width/2,b.left+b.width],my=[b.top,b.top+b.height/2,b.top+b.height];let dx=t,dy=t;
cv.getObjects().forEach(p=>{if(p===o||!p.visible||(o._objects&&o._objects.includes(p)))return;const q=p.getBoundingRect(true,true);
mx.forEach(a=>[q.left,q.left+q.width/2,q.left+q.width].forEach(c=>{if(Math.abs(c-a)<Math.abs(dx))dx=c-a}));
my.forEach(a=>[q.top,q.top+q.height/2,q.top+q.height].forEach(c=>{if(Math.abs(c-a)<Math.abs(dy))dy=c-a}))});
if(Math.abs(dx)<t)o.left+=dx;if(Math.abs(dy)<t)o.top+=dy;o.setCoords()});
const bind=(id,fn)=>$(id).addEventListener('input',e=>{fn(e.target.value);upd()});
bind('#L1',v=>{G.L=+v;$('#Lv').textContent=v+'°'});bind('#sh',v=>G.sh=+v);bind('#sp',v=>G.spec=v/100);bind('#gl',v=>G.glow=v/100);bind('#gs',v=>G.gloss=v/100);
bind('#cc',v=>{G.col=v;all(o=>{if(o.g)o.base=v})});bind('#ac',v=>{G.ac=v;all(o=>{if(o.a)o.base=v})});bind('#sa',v=>G.A=v);bind('#sb2',v=>G.B=v);
const act=f=>{cv.getActiveObjects().forEach(o=>each(o,f));upd()};
$('#pc').oninput=e=>act(o=>{if(o.role){o.base=e.target.value;o.g=0;o.a=0;o.tx=0}});
$('#pm').onchange=e=>act(o=>{if(o.role)o.mat=e.target.value||null});
$('#po').oninput=e=>{cv.getActiveObjects().forEach(o=>o.set('opacity',e.target.value/100));cv.requestRenderAll()};
$('#pb').onchange=e=>{cv.getActiveObjects().forEach(o=>o.set('globalCompositeOperation',e.target.value));cv.requestRenderAll()};
$('#pr').oninput=e=>act(o=>{if(o.type=='rect')o.set({rx:+e.target.value,ry:+e.target.value})});
T.forEach((t,i)=>{const b=document.createElement('button');b.className='bt';b.textContent=t.i+' '+t.n;b.onclick=()=>load(i);$('#tg').append(b);$('#ts').add(new Option(t.n,i))});
$('#ts').onchange=e=>load(+e.target.value);
Object.entries(MATS).forEach(([k,m])=>{const b=document.createElement('button');b.className='bt';b.dataset.k=k;b.textContent=m.n;b.onclick=()=>{G.mat=k;sync();upd()};$('#mg').append(b);$('#pm').add(new Option(m.n,k))});
$('#pm').add(new Option('Inherit',''),0);
const add=(o,n)=>{o.nm=n;o.role=o.role||'shape';o.base=o.base||G.col;cv.add(o);cv.setActiveObject(o);each(o,lit);cv.requestRenderAll()};
$('#aR').onclick=()=>add(new fabric.Rect({left:560,top:420,width:200,height:120,rx:16,ry:16,fill:G.col}),'Rectangle');
$('#aC').onclick=()=>add(new fabric.Circle({left:620,top:420,radius:70,fill:G.col}),'Circle');
$('#aP').onclick=()=>add(new fabric.Rect({left:560,top:450,width:220,height:56,rx:28,ry:28,fill:G.col}),'Pill');
$('#aT').onclick=()=>add(new fabric.IText('CONCEPT',{left:560,top:450,fontSize:54,fontWeight:800,charSpacing:160,fill:'#eaf0fa',fontFamily:'Inter,system-ui,sans-serif',role:'text'}),'Text');
$('#aD').onclick=e=>{cv.isDrawingMode=!cv.isDrawingMode;e.target.classList.toggle('on',cv.isDrawingMode);const b=cv.freeDrawingBrush;b.color=$('#pc').value;b.width=6};
cv.on('path:created',e=>{e.path.role='ink';e.path.nm='Drawing';lit(e.path)});
$('#aI').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>fabric.Image.fromURL(r.result,i=>{i.scaleToWidth(Math.min(420,i.width));i.set({left:500,top:380});i.role='img';add(i,f.name.slice(0,22))});r.readAsDataURL(f);e.target.value=''};
$('#mp').onclick=()=>{const i=cv.getActiveObject(),s=cv.getObjects().find(o=>o.role=='screen');if(!i||!s||i===s||i.type=='activeSelection')return;
const w=s.width*s.scaleX,h=s.height*s.scaleY,k=Math.max(w/i.width,h/i.height),p=s.getCenterPoint();
i.set({scaleX:k,scaleY:k,angle:s.angle||0,originX:'center',originY:'center',left:p.x,top:p.y,mapped:true,shadow:null,clipPath:new fabric.Rect({width:w,height:h,rx:s.rx,ry:s.ry,originX:'center',originY:'center',left:p.x,top:p.y,absolutePositioned:true})});
i.setCoords();cv.moveTo(i,0);cv.moveTo(i,cv.getObjects().indexOf(s));cv.requestRenderAll();layers()};
$('#gG').onclick=()=>{const a=cv.getActiveObject();if(a&&a.type=='activeSelection'){const g=a.toGroup();g.nm='Group';cv.requestRenderAll();layers()}};
$('#gU').onclick=()=>{const a=cv.getActiveObject();if(a&&a.type=='group'){a.toActiveSelection();cv.requestRenderAll();layers()}};
const dup=()=>{const a=cv.getActiveObject();if(!a||a.type=='activeSelection')return;a.clone(c=>{c.set({left:a.left+24,top:a.top+24});c.nm=(a.nm||'Layer')+' copy';cv.add(c);cv.setActiveObject(c);each(c,lit);cv.requestRenderAll()},['role','base','mat','nm','g','a','tx','mapped','lk'])};
const del=()=>{cv.getActiveObjects().forEach(o=>cv.remove(o));cv.discardActiveObject();cv.requestRenderAll()};
$('#gD').onclick=dup;$('#gX').onclick=del;
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||(cv.getActiveObject()||{}).isEditing)return;const m=e.ctrlKey||e.metaKey;
if(e.key=='Delete'||e.key=='Backspace')del();else if(m&&e.key=='d'){e.preventDefault();dup()}else if(m&&e.key=='g'){e.preventDefault();$(e.shiftKey?'#gU':'#gG').click()}});
$('#zi').onclick=()=>zoom(Z*1.2);$('#zo').onclick=()=>zoom(Z/1.2);$('#zf').onclick=fit;addEventListener('resize',fit);
$('#vp').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(Z*(e.deltaY<0?1.1:.9))}},{passive:false});
const bgs=['chk','dk','lt'];let bi=0;$('#bg').onclick=()=>{bi=(bi+1)%3;$('#cw').className=bgs[bi]};
$('#tl').onclick=()=>$('#L').classList.toggle('c');$('#tr').onclick=()=>$('#Rr').classList.toggle('c');
function shot(s,t){cv.discardActiveObject();const z=Z;cv.setZoom(1);cv.setDimensions({width:W,height:H});let o={};
if(t){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;cv.getObjects().forEach(p=>{if(!p.visible)return;const b=p.getBoundingRect(true,true);x0=Math.min(x0,b.left);y0=Math.min(y0,b.top);x1=Math.max(x1,b.left+b.width);y1=Math.max(y1,b.top+b.height)});
if(x1>x0){const p=G.sh*2+30;o={left:x0-p,top:y0-p,width:x1-x0+2*p,height:y1-y0+2*p}}}
const el=cv.toCanvasElement(s,o);zoom(z);return el}
$('#ex').onclick=async()=>{const s=+$('#xs').value,el=shot(s,$('#tm').checked),name=(G.cur.replace(/\W+/g,'-')+'@'+s+'x.png').toLowerCase(),blob=await new Promise(r=>el.toBlob(r,'image/png'));
const local=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
if(dl){try{await dl.save({filename:name,data:blob})}catch(e){if(e&&e.code!='declined')local()}}else local()};
$('#p3').onclick=()=>{$('#pi').src=shot(1,1).toDataURL();$('#pi').style.transform='';$('#pv').style.display='flex'};
$('#pv').onmousemove=e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;$('#pi').style.transform=`rotateY(${x*30}deg) rotateX(${-y*30}deg)`};
$('#pv').onclick=()=>$('#pv').style.display='none';
load(0);
</script></body></html>
